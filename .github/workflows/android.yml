name: Build Luxe Music APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LuxeMusic-source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Source
        run: |
          unzip LuxeMusic-source.zip
          ls -la LuxeMusic

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p LuxeMusic assembleDebug assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuxeMusic-APKs
          path: |
            LuxeMusic/app/build/outputs/apk/debug/*.apk
            LuxeMusic/app/build/outputs/apk/release/*.apk
